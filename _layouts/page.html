---
layout: default
---

{% if page.hero_image %}
  <section class="page-hero page-hero--image">
    <img src="{% include link-target.html url=page.hero_image %}" alt="{{ page.hero_image_alt | default: page.title | escape }}">
  </section>

  <section class="page-title-section">
    <div class="wrap">
      <h1>{{ page.title }}</h1>
      {% if page.lede %}
        <p class="lede">{{ page.lede }}</p>
      {% endif %}
    </div>
  </section>
{% else %}
  <section class="page-hero">
    <div class="wrap">
      <h1>{{ page.title }}</h1>
      {% if page.lede %}
        <p class="lede">{{ page.lede }}</p>
      {% endif %}
    </div>
  </section>
{% endif %}

<section class="content-section">
  <div class="wrap prose">
    {{ content }}
  </div>
</section>
